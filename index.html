  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: white;
      font-family: sans-serif;
    }
    img, video, iframe { max-width: 100%; }

    .top-banner {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-wrap {
      text-align: center;
      padding: 20px;
      width: min(100%, 900px);
      margin: 0 auto;
    }

    .video-wrap video {
      width: min(100%, 800px);
      height: auto;
      display: inline-block;
    }

    .player {
      width: 100%;
      min-height: 100px;
      background-color: gray;
      text-align: center;
      padding: 12px;
      opacity: 1;
    }


    .player h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.5vw, 2rem);
      color: white;
      opacity: 0;
    }

    .calendar {
      width: 100%;
      background-color: #87cefa;
      text-align: center;
      padding: 16px 12px;
      opacity: 1;
    }

    .calendar iframe {
      width: min(100%, 800px);
      height: clamp(420px, 60vh, 600px);
      max-width: 100%;
      border: 0;
    }

    .tournament {
      width: 100%;
      background-color: #99dfbe;
      text-align: center;
      padding: 16px 12px;
      display: block;
    }

    .tournament img {
      width: min(100%, 280px);
      height: auto;
      display: flex;
      margin: 0 auto;
    }

    .tournament-g {
      display: flex;
    }
    .slide-items {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    .slide-items .slick-slide {
      padding: 0 8px;
    }

    .slide-items a {
      display: block;
    }

    .slide-items img {
      width: 100%;
      object-fit: cover;
      display: block;
      border-radius: 8px;
    }

   

    .slick-prev:before,
    .slick-next:before {
      color: black;
    }

    .slick-dots li button:before {
      font-size: 18px;
      top: 6px;
    }

    .wrapper {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      padding: 0 12px;
    }

    .item {
      width: 100%;
      opacity: 0;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    a {
      color: #000000;
      text-decoration: none;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    @media (max-width: 768px) {
      .wrapper {
        grid-template-columns: 1fr;
      }
    }

      .slide-items {
        max-width: 100%;
      }

      .calendar iframe {
        height: 420px;
      }
    
      #feature .grid {

    gap: 26px;

    .header {
  background-color: #d6d6d6;
  opacity: .7;
  padding: 1rem;
  margin: 0;
  width: 100%;
  box-sizing: border-box;
  font-size: xx-large
}

  .stickyHeader {
  position: sticky;
  top: 0;
}
  .scroller {
    opacity: 0;

  }
  .menu-wrapper {
  position: relative;
}

.header h1 {
  margin: 0;
  font-size: 2.0rem;
  color: #ff8800;
}

.menu-icon {
  width: 40px;
  height: 30px;
  position: fixed; /* 固定位置 */
  top: 20px;
  right: 20px;
  cursor: pointer;
  z-index: 3;
  display: inline-block;
}

.menu-icon span {
  display: block;
  height: 4px;
  margin: 6px 0;
  background: #ff8800;
  border-radius: 2px;
  transition: 0.4s;
}

/* ハンバーガーがXに変形 */
#menu-toggle:checked + .menu-icon span:nth-child(1) {
  transform: translateY(10px) rotate(45deg);
}
#menu-toggle:checked + .menu-icon span:nth-child(2) {
  opacity: 0;
}
#menu-toggle:checked + .menu-icon span:nth-child(3) {
  transform: translateY(-10px) rotate(-45deg);
}

/* オーバーレイ背景 */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: 0.4s;
  z-index: 1;
}

#menu-toggle:checked ~ .overlay {
  opacity: 1;
  pointer-events: auto;
}

/* メニュー本体（右から出す） */
.menu {
  position: fixed;
  top: 0;
  right: -250px; /* 初期位置を右へ */
  width: 250px;
  height: 100%;
  background: #fff;
  box-shadow: -2px 0 8px rgba(0,0,0,0.2);
  transition: right 0.4s ease;
  z-index: 2;
}

#menu-toggle:checked ~ .menu {
  right: 0; /* 開いたときは右0へ */
}

.menu ul {
  list-style: none;
  padding: 60px 20px;
}

.menu li {
  margin: 20px 0;
}

.menu a {
  text-decoration: none;
  color: #333;
  font-size: 1.2rem;
  transition: color 0.3s;
}

.menu a:hover {
  color: #007bff;
}
.label {
  color: #fffefe;
}

  <script>
    $(window).on('load', function () {
      $('.slide-items').not('.slick-initialized').slick({
        autoplay: true,

  <script>
    ScrollTrigger.batch(".scroller", {
    onEnter: (elements, triggers) => {
      gsap.to(elements, { opacity: 1, stagger: 0.15 });
      console.log(elements.length, "elements entered");
    },
  
    start: "top center",
    markers: false
        // デバッグ用のマーカーを表示する場合は有効にする
  });
  </script>

  <script>
 const PASSWORD = "123";

const videoList = [
  { id: "video-1", url: "https://www.youtube.com/playlist?list=PLJAwkEamMVyA" },
  { id: "video-2", url: "https://www.youtube.com/playlist?list=PLdTqnyWJUhdQ" },
  { id: "video-3", url: "https://www.youtube.com/playlist?list=PLYtlY4PvKJV8" }
];

document.addEventListener('DOMContentLoaded', () => {
  const loginArea = document.getElementById('login-area');
  const videoArea = document.getElementById('video-area');
  const passwordInput = document.getElementById('password-input');
  const loginButton = document.getElementById('login-button');
  const errorMessage = document.getElementById('error-message');

  // 動画エリアを表示する関数
  function unlock() {
    loginArea.style.display = 'none';
    videoArea.style.display = 'grid';
    videoArea.style.gridTemplateColumns = 'repeat(3, minmax(0, 1fr))';
  }

  // すでに認証済み(同じタブ内)なら最初から表示
  try {
    if (sessionStorage.getItem('authenticated') === 'true') {
      unlock();
    }
  } catch (e) {}

  // パスワードチェック
  function checkPassword() {
    if (passwordInput.value === PASSWORD) {
      try {
        sessionStorage.setItem('authenticated', 'true');
      } catch (e) {}
      unlock();
    } else {
      errorMessage.textContent = "パスワードが違います。";
      passwordInput.value = "";
    }
  }

  loginButton.addEventListener('click', checkPassword);

  // Enterキーでも送信できるように
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  // 各画像のクリックでリンク先へ(パスワード確認は不要)
  videoList.forEach(item => {
    const imgElement = document.getElementById(item.id);
    if (!imgElement) return;
    imgElement.addEventListener('click', () => {
      window.open(item.url, '_blank');
    });
  });
});
  </script>
