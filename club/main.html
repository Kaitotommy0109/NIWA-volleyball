  <script>
    async function checkAuth() {
      const response = await fetch('/api/checkAuth');
      const result = await response.json();

      if (!response.ok || !result.authenticated) {
        alert('アクセス権限がありません。ログインしてください。');
        window.location.href = '../index.html';
      }
    }

    checkAuth();
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: white;
      font-family: sans-serif;
    }
    img, video, iframe { max-width: 100%; }

    .top-banner {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-wrap {
      text-align: center;
      padding: 12px;
    }

    .video-wrap video {
      width: min(100%, 600px);
      height: auto;
      display: inline-block;
    }

    .player {
      width: 100%;
      min-height: 100px;
      background-color: gray;
      text-align: center;
      padding: 12px;
    }

    .player h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.5vw, 2rem);
      color: white;
    }

    .calendar {
      width: 100%;
      background-color: #87cefa;
      text-align: center;
      padding: 16px 12px;
    }

    .calendar iframe {
      width: min(100%, 800px);
      height: clamp(420px, 60vh, 600px);
      max-width: 100%;
      border: 0;
    }

    .tournament {
      width: 100%;
      background-color: #99dfbe;
      text-align: center;
      padding: 16px 12px;
    }

    .tournament img {
      width: min(100%, 280px);
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .slide-items {
      width: 100%;
      max-width: 90%;
      margin: 0 auto;
      overflow: hidden;
    }

    .slide-items .slick-slide {
      padding: 0 8px;
    }

    .slide-items a {
      display: block;
    }

    .slide-items img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      border-radius: 8px;
    }

    .slick-prev:before,
    .slick-next:before {
      color: black;
    }

    .slick-dots li button:before {
      font-size: 18px;
      top: 6px;
    }

    .wrapper {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      padding: 0 12px;
    }

    .item img {
      width: 100%;
      height:auto;
      display: block;
    }

    a {
      color: #000000;
      text-decoration: none;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    @media (max-width: 768px) {
      .wrapper {
        grid-template-columns: 1fr;
      }

      .slide-items {
        max-width: 92%;
      }

      .calendar iframe {
        height: 420px;
      }
    }
      #feature .grid {
    display: grid;
    gap: 26px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    #feature .grid .item {
      transition: all  0.3s ease;
      box-shadow: 0 0 8px 4px #ccc;
    }
    #feature .grid img {
      vertical-align: top;
    }
    #feature .grid .item-content {
      padding: 30px;
    }
    #feature .grid .item-cat {
      font-size: 0.75rem;
      margin-bottom: 20px;
    }
    #feature .grid .item-text {
      font-weight: bold;
      margin-bottom: 20px;
    }
    #feature .grid .item-date {
      font-size: 0.75rem;
      text-align: right;
    }
  </style>
</head>
