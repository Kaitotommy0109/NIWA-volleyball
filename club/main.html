<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIWA VB Log</title>

  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

  <!-- GSAP本体とScrollTriggerの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script>
    if (sessionStorage.getItem('isLogged') !== 'true') {
      alert('アクセス権限がありません。ログインしてください。');
      window.location.href = '../index.html';
    }
  </script>
  
  

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: white;
      font-family: sans-serif;
    }
    img, video, iframe { max-width: 100%; }

    .top-banner {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-wrap {
      text-align: center;
      padding: 20px;
      width: min(100%, 900px);
      margin: 0 auto;
    }

    .video-wrap video {
      width: min(100%, 800px);
      height: auto;
      display: inline-block;
    }

    .player {
      width: 100%;
      min-height: 100px;
      background-color: gray;
      text-align: center;
      padding: 12px;
      opacity: 1;
    }


    .player h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.5vw, 2rem);
      color: white;
      opacity: 0;
    }

    .calendar {
      width: 100%;
      background-color: #87cefa;
      text-align: center;
      padding: 16px 12px;
      opacity: 1;
    }

    .calendar iframe {
      width: min(100%, 800px);
      height: clamp(420px, 60vh, 600px);
      max-width: 100%;
      border: 0;
    }

    .tournament {
      width: 100%;
      background-color: #99dfbe;
      text-align: center;
      padding: 16px 12px;
    }

    .tournament img {
      width: min(100%, 280px);
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .slide-items {
      width: 100%;
      max-width: 90%;
      margin: 0 auto;
      overflow: hidden;
    }

    .slide-items .slick-slide {
      padding: 0 8px;
    }

    .slide-items a {
      display: block;
    }

    .slide-items img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      border-radius: 8px;
    }

    .slick-prev:before,
    .slick-next:before {
      color: black;
    }

    .slick-dots li button:before {
      font-size: 18px;
      top: 6px;
    }

    .wrapper {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      padding: 0 12px;
    }

    .item {
      width: 100%;
      opacity: 0;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    a {
      color: #000000;
      text-decoration: none;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    @media (max-width: 768px) {
      .wrapper {
        grid-template-columns: 1fr;
      }
    }

      .slide-items {
        max-width: 92%;
      }

      .calendar iframe {
        height: 420px;
      }
    
      #feature .grid {
    display: grid;
    gap: 26px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    #feature .grid .item {
      transition: all  0.3s ease;
      box-shadow: 0 0 8px 4px #ccc;
    }
    #feature .grid img {
      vertical-align: top;
    }
    #feature .grid .item-content {
      padding: 30px;
    }
    #feature .grid .item-cat {
      font-size: 0.75rem;
      margin-bottom: 20px;
    }
    #feature .grid .item-text {
      font-weight: bold;
      margin-bottom: 20px;
    }
    #feature .grid .item-date {
      font-size: 0.75rem;
      text-align: right;
    }


    .header {
  background-color: #d6d6d6;
  opacity: .7;
  padding: 1rem;
  margin: 0;
  width: 100%;
  box-sizing: border-box;
  font-size: xx-large
}

  .stickyHeader {
  position: sticky;
  top: 0;
}
  .scroller {
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
  }
  </style>
</head>

  <script>
    $(window).on('load', function () {
      $('.slide-items').not('.slick-initialized').slick({
        autoplay: true,
        autoplaySpeed: 3000,
        slidesToShow: 3,
        slidesToScroll: 1,
        infinite: true,
        arrows: true,
        dots: true,
        pauseOnHover: true,
        responsive: [
          {
            breakpoint: 768,
            settings: {
              slidesToShow: 1,
              arrows: false,
              dots: true
            }
          }
        ]
      });
    });
  </script>

  <script>
    ScrollTrigger.batch(".scroller", {
    onEnter: (elements, triggers) => {
      gsap.to(elements, { opacity: 1, stagger: 0.15 });
      console.log(elements.length, "elements entered");
    },
  
    start: "top center",
    markers: true
        // デバッグ用のマーカーを表示する場合は有効にする
  });
  </script>
</body>
</html>
