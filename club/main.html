    <style>
    .slide-items {
        width: 100%;
        max-width: 80%;
        margin: 0 auto;

    .slide-items li {
        margin: 0 10px;
    }

    .slide-items img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
        border-radius: 8px;
    }

    .slick-prev:before,
    .slick-next:before {
        color: black;
    }
    .slick-dots li button:before {

    a {
      color: #000000;
      text-decoration: none;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    .wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }

    .item {
      flex: 0 0 calc(33.333% - 20px);
      margin: 10px;
      }

    /* make images scale within items */
    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* responsive adjustments for smaller screens */
    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
        align-items: center;
      }
      .item {
        flex: 1 1 90%;
      }
    }
    .player {
      width: 100%;
      height: 100px;
      background-color: gray;
      text-align: center;
    }

    .calendar {
      width: 100%;

    .tournament {
